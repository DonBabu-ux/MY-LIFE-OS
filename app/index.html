<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MyLifeOS (Web Preview)</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0E1013;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* Center as mobile device frame on wide screens */
      @media (min-width: 600px) {
        body {
          align-items: center;
          justify-content: center;
          background: #060709;
        }
        #root {
          width: 420px;
          height: 880px;
          border-radius: 40px;
          box-shadow: 0 0 0 8px #1F242D, 0 25px 60px rgba(0,0,0,0.8);
          overflow: hidden;
          position: relative;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>

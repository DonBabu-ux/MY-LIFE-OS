<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MyLifeOS (Web Preview)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #060709;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* Center as mobile device frame on wide screens */
      @media (min-width: 600px) {
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at 50% 15%, #181d29 0%, #07090e 100%);
          padding: 16px;
        }
        #root {
          max-width: 430px;
          height: 100%;
          max-height: min(900px, calc(100vh - 32px));
          border-radius: 40px;
          box-shadow: 0 0 0 10px #1c222e, 0 25px 65px rgba(0, 0, 0, 0.85);
          border: 1px solid rgba(255, 255, 255, 0.08);
          position: relative;
        }
        /* Subtle phone speaker pill at the top of the frame */
        #root::before {
          content: "";
          position: absolute;
          top: 10px;
          left: 50%;
          transform: translateX(-50%);
          width: 90px;
          height: 18px;
          background-color: #0c0e14;
          border-radius: 12px;
          z-index: 99999;
          pointer-events: none;
          box-shadow: inset 0 0 3px rgba(0,0,0,0.8);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
